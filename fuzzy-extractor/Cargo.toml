[package]
name = "fuzzy-extractor"
version = "0.1.0"
edition = "2021"
description = "Library for generating and restoring cryptocurrency wallets based on face embeddings"
authors = ["Kasso4ka serovdn22@gmail.com"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.13"
console_error_panic_hook = { version = "0.1.7", optional = true }
web-sys = { version = "0.3.77", features = ["console"] }
wee_alloc = "0.4.5"
libsecp256k1 = "0.7"

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
