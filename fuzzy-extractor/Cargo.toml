[package]
name = "fuzzy-extractor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_core = "0.6"
pbkdf2 = "0.11"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.13"
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }